<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CustomCape 망토 제작기</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111318;
            color: white;
            font-family: Arial, "Noto Sans KR", sans-serif;
        }

        header {
            text-align: center;
            padding: 24px;
            background: #181b22;
            border-bottom: 1px solid #303641;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            color: #a7afbd;
        }

        .container {
            max-width: 1150px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .panel {
            background: #191d24;
            border: 1px solid #2d333d;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 18px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        button,
        .file-button {
            background: #262c36;
            color: white;
            border: 1px solid #3a424f;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover,
        .file-button:hover {
            background: #333b48;
        }

        button.active {
            background: #5865f2;
            border-color: #7580ff;
        }

        .download {
            background: #248046;
            border-color: #35a45b;
        }

        .download:hover {
            background: #2d9955;
        }

        .reset {
            background: #704b22;
            border-color: #976a32;
        }

        .reset:hover {
            background: #855c29;
        }

        input[type="file"] {
            display: none;
        }

        .rgb-box {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #11151b;
            padding: 6px 10px;
            border-radius: 8px;
        }

        .rgb-box input[type="number"] {
            width: 58px;
            background: #242a33;
            color: white;
            border: 1px solid #3b4452;
            border-radius: 5px;
            padding: 7px;
        }

        #colorPicker {
            width: 48px;
            height: 38px;
            border: none;
            background: transparent;
            cursor: pointer;
        }

        .color-preview {
            width: 35px;
            height: 35px;
            border-radius: 6px;
            border: 2px solid white;
            background: rgb(255, 0, 0);
        }

        .canvas-container {
            overflow: auto;
            padding: 20px;
            border-radius: 12px;

            background-color: #242a33;

            background-image:
                    linear-gradient(45deg, #353c47 25%, transparent 25%),
                    linear-gradient(-45deg, #353c47 25%, transparent 25%),
                    linear-gradient(45deg, transparent 75%, #353c47 75%),
                    linear-gradient(-45deg, transparent 75%, #353c47 75%);

            background-size: 20px 20px;

            background-position:
                    0 0,
                    0 10px,
                    10px -10px,
                    -10px 0;
        }

        #editor {
            display: block;
            width: 1024px;
            height: 512px;

            image-rendering: pixelated;
            image-rendering: crisp-edges;

            cursor: crosshair;
            touch-action: none;
        }

        .info {
            margin-top: 12px;
            font-size: 13px;
            color: #a7afbd;
        }

        .coordinate {
            margin-left: auto;
            color: #a7afbd;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .container {
                padding: 0 8px;
            }

            .panel {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>CustomCape 망토 제작기</h1>

    <p>
        64×32 픽셀 Minecraft 망토를 직접 만들어보세요.
    </p>
</header>


<div class="container">

    <div class="panel">

        <div class="toolbar">

            <button
                    id="pencilBtn"
                    class="active"
                    onclick="setTool('pencil')"
            >
                ✏ 연필
            </button>


            <button
                    id="eraserBtn"
                    onclick="setTool('eraser')"
            >
                ⌫ 지우개
            </button>


            <button
                    id="pickerBtn"
                    onclick="setTool('picker')"
            >
                💧 스포이드
            </button>


            <div class="rgb-box">

                R

                <input
                        id="red"
                        type="number"
                        min="0"
                        max="255"
                        value="255"
                >

                G

                <input
                        id="green"
                        type="number"
                        min="0"
                        max="255"
                        value="0"
                >

                B

                <input
                        id="blue"
                        type="number"
                        min="0"
                        max="255"
                        value="0"
                >

            </div>


            <input
                    id="colorPicker"
                    type="color"
                    value="#ff0000"
            >


            <div
                    id="colorPreview"
                    class="color-preview"
            ></div>


            <button onclick="undo()">
                ↶ 실행 취소
            </button>


            <button onclick="clearCanvas()">
                전체 지우기
            </button>


            <button
                    class="reset"
                    onclick="resetToDefault()"
            >
                기본 양식 복원
            </button>


            <label class="file-button">

                PNG 불러오기

                <input
                        id="fileInput"
                        type="file"
                        accept="image/png"
                >

            </label>


            <button
                    class="download"
                    onclick="downloadCape()"
            >
                ⬇ PNG 다운로드
            </button>


            <div
                    id="coordinate"
                    class="coordinate"
            >
                X: - / Y: -
            </div>

        </div>

    </div>


    <div class="panel">

        <div class="canvas-container">

            <canvas
                    id="editor"
                    width="1024"
                    height="512"
            ></canvas>

        </div>


        <div class="info">

            한 칸 = 실제 PNG의 1픽셀
            &nbsp;|&nbsp;

            실제 저장 크기:
            <b>64 × 32 PNG</b>

            &nbsp;|&nbsp;

            처음 접속하면 기본 망토 양식이 자동으로 표시됩니다.

        </div>

    </div>

</div>


<script>

    // ==========================================
    // 기본 설정
    // ==========================================

    const WIDTH = 64;
    const HEIGHT = 32;
    const SCALE = 16;


    // ==========================================
    // 기본 망토 이미지
    // 사용자가 올린 64x32 PNG를 HTML 내부에 저장
    // ==========================================

    const DEFAULT_CAPE =
        "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAAAgCAMAAACVQ462AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJUExURQAAAP///wAAAHPGg3EAAAADdFJOU///ANfKDUEAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAAZdEVYdFNvZnR3YXJlAFBhaW50Lk5FVCA1LjEuMTGKCBbOAAAAuGVYSWZJSSoACAAAAAUAGgEFAAEAAABKAAAAGwEFAAEAAABSAAAAKAEDAAEAAAACAAAAMQECABEAAABaAAAAaYcEAAEAAABsAAAAAAAAAGAAAAABAAAAYAAAAAEAAABQYWludC5ORVQgNS4xLjExAAADAACQBwAEAAAAMDIzMAGgAwABAAAAAQAAAAWgBAABAAAAlgAAAAAAAAACAAEAAgAEAAAAUjk4AAIABwAEAAAAMDEwMAAAAAAGNdRzso9yOwAAAMlJREFUSEvtlEEShSAMQwv3P7RDG5C2QVG3ZlwwSX0/gn6pQlRPEctJpAxNy3lgHs+6Bdx12AJYygmWSr9K+6kiDlAB5gQFtFv0PrRIAGTOhVKDFaDlzoXiHvBHaObiGZDoxGAlQPedjRCdUR8nlgAYczbC1EAXaeYa0BueAD9qe8g3IQNs6Yd69AGAds62bA9Abcu2AHhRX++BHqSelbc1ioaJAniDaJgiwL6n94DxRQebTELRvjjGaJiSvfxbI9Yz/YAf0PQZcABjTAzvSFDNiAAAAABJRU5ErkJggg==";


    // ==========================================
    // 실제 저장될 64x32 캔버스
    // ==========================================

    const capeCanvas =
        document.createElement("canvas");

    capeCanvas.width =
        WIDTH;

    capeCanvas.height =
        HEIGHT;


    const capeCtx =
        capeCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    capeCtx.imageSmoothingEnabled =
        false;


    // ==========================================
    // 화면 표시용 캔버스
    // ==========================================

    const editor =
        document.getElementById(
            "editor"
        );


    const ctx =
        editor.getContext(
            "2d"
        );


    ctx.imageSmoothingEnabled =
        false;


    // ==========================================
    // RGB 관련
    // ==========================================

    const red =
        document.getElementById(
            "red"
        );


    const green =
        document.getElementById(
            "green"
        );


    const blue =
        document.getElementById(
            "blue"
        );


    const colorPicker =
        document.getElementById(
            "colorPicker"
        );


    const colorPreview =
        document.getElementById(
            "colorPreview"
        );


    const coordinate =
        document.getElementById(
            "coordinate"
        );


    // ==========================================
    // 현재 상태
    // ==========================================

    let tool =
        "pencil";


    let drawing =
        false;


    let lastX =
        -1;


    let lastY =
        -1;


    const history =
        [];


    // ==========================================
    // RGB 숫자 제한
    // ==========================================

    function clampRGB(value) {

        value =
            parseInt(value);


        if (
            isNaN(value)
        ) {

            return 0;
        }


        return Math.max(
            0,
            Math.min(
                255,
                value
            )
        );
    }


    // ==========================================
    // RGB → HEX
    // ==========================================

    function rgbToHex(
        r,
        g,
        b
    ) {

        return "#"
            +
            r.toString(16).padStart(2, "0")
            +
            g.toString(16).padStart(2, "0")
            +
            b.toString(16).padStart(2, "0");
    }


    // ==========================================
    // HEX → RGB
    // ==========================================

    function hexToRgb(hex) {

        return {

            r:
                parseInt(
                    hex.substring(
                        1,
                        3
                    ),
                    16
                ),

            g:
                parseInt(
                    hex.substring(
                        3,
                        5
                    ),
                    16
                ),

            b:
                parseInt(
                    hex.substring(
                        5,
                        7
                    ),
                    16
                )

        };
    }


    // ==========================================
    // 현재 RGB 색상
    // ==========================================

    function getColor() {

        const r =
            clampRGB(
                red.value
            );


        const g =
            clampRGB(
                green.value
            );


        const b =
            clampRGB(
                blue.value
            );


        return `rgb(${r}, ${g}, ${b})`;
    }


    // ==========================================
    // RGB 입력 변경
    // ==========================================

    function updateFromRGB() {

        const r =
            clampRGB(
                red.value
            );


        const g =
            clampRGB(
                green.value
            );


        const b =
            clampRGB(
                blue.value
            );


        red.value =
            r;


        green.value =
            g;


        blue.value =
            b;


        const hex =
            rgbToHex(
                r,
                g,
                b
            );


        colorPicker.value =
            hex;


        colorPreview.style.background =
            hex;
    }


    // ==========================================
    // 색상 선택창 변경
    // ==========================================

    function updateFromPicker() {

        const rgb =
            hexToRgb(
                colorPicker.value
            );


        red.value =
            rgb.r;


        green.value =
            rgb.g;


        blue.value =
            rgb.b;


        colorPreview.style.background =
            colorPicker.value;
    }


    red.addEventListener(
        "input",
        updateFromRGB
    );


    green.addEventListener(
        "input",
        updateFromRGB
    );


    blue.addEventListener(
        "input",
        updateFromRGB
    );


    colorPicker.addEventListener(
        "input",
        updateFromPicker
    );


    // ==========================================
    // 도구 선택
    // ==========================================

    function setTool(name) {

        tool =
            name;


        document
            .getElementById(
                "pencilBtn"
            )
            .classList.remove(
            "active"
        );


        document
            .getElementById(
                "eraserBtn"
            )
            .classList.remove(
            "active"
        );


        document
            .getElementById(
                "pickerBtn"
            )
            .classList.remove(
            "active"
        );


        if (
            name ===
            "pencil"
        ) {

            document
                .getElementById(
                    "pencilBtn"
                )
                .classList.add(
                "active"
            );
        }


        if (
            name ===
            "eraser"
        ) {

            document
                .getElementById(
                    "eraserBtn"
                )
                .classList.add(
                "active"
            );
        }


        if (
            name ===
            "picker"
        ) {

            document
                .getElementById(
                    "pickerBtn"
                )
                .classList.add(
                "active"
            );
        }
    }


    // ==========================================
    // 편집 화면 렌더링
    // ==========================================

    function render() {

        ctx.clearRect(
            0,
            0,
            editor.width,
            editor.height
        );


        ctx.imageSmoothingEnabled =
            false;


        ctx.drawImage(
            capeCanvas,
            0,
            0,
            WIDTH * SCALE,
            HEIGHT * SCALE
        );


        drawGrid();
    }


    // ==========================================
    // 64 x 32 픽셀 그리드
    // ==========================================

    function drawGrid() {

        ctx.beginPath();


        ctx.strokeStyle =
            "rgba(255,255,255,0.18)";


        ctx.lineWidth =
            1;


        for (
            let x = 0;
            x <= WIDTH;
            x++
        ) {

            const px =
                x * SCALE
                +
                0.5;


            ctx.moveTo(
                px,
                0
            );


            ctx.lineTo(
                px,
                HEIGHT * SCALE
            );
        }


        for (
            let y = 0;
            y <= HEIGHT;
            y++
        ) {

            const py =
                y * SCALE
                +
                0.5;


            ctx.moveTo(
                0,
                py
            );


            ctx.lineTo(
                WIDTH * SCALE,
                py
            );
        }


        ctx.stroke();
    }


    // ==========================================
    // 마우스 좌표 → 64x32 픽셀 위치
    // ==========================================

    function getPixel(event) {

        const rect =
            editor
                .getBoundingClientRect();


        const mouseX =
            event.clientX
            -
            rect.left;


        const mouseY =
            event.clientY
            -
            rect.top;


        const x =
            Math.floor(
                mouseX
                /
                rect.width
                *
                WIDTH
            );


        const y =
            Math.floor(
                mouseY
                /
                rect.height
                *
                HEIGHT
            );


        return {

            x:
                Math.max(
                    0,
                    Math.min(
                        WIDTH - 1,
                        x
                    )
                ),

            y:
                Math.max(
                    0,
                    Math.min(
                        HEIGHT - 1,
                        y
                    )
                )

        };
    }


    // ==========================================
    // 작업 기록 저장
    // ==========================================

    function saveHistory() {

        history.push(

            capeCtx.getImageData(
                0,
                0,
                WIDTH,
                HEIGHT
            )

        );


        if (
            history.length >
            50
        ) {

            history.shift();
        }
    }


    // ==========================================
    // 실행 취소
    // ==========================================

    function undo() {

        if (
            history.length ===
            0
        ) {

            return;
        }


        const image =
            history.pop();


        capeCtx.putImageData(
            image,
            0,
            0
        );


        render();
    }


    // ==========================================
    // 픽셀 그리기
    // ==========================================

    function paint(
        x,
        y
    ) {

        if (
            tool ===
            "pencil"
        ) {

            capeCtx.fillStyle =
                getColor();


            capeCtx.fillRect(
                x,
                y,
                1,
                1
            );
        }


        if (
            tool ===
            "eraser"
        ) {

            capeCtx.clearRect(
                x,
                y,
                1,
                1
            );
        }


        render();
    }


    // ==========================================
    // 스포이드
    // ==========================================

    function pickColor(
        x,
        y
    ) {

        const pixel =
            capeCtx
                .getImageData(
                    x,
                    y,
                    1,
                    1
                )
                .data;


        if (
            pixel[3] ===
            0
        ) {

            return;
        }


        red.value =
            pixel[0];


        green.value =
            pixel[1];


        blue.value =
            pixel[2];


        updateFromRGB();


        setTool(
            "pencil"
        );
    }


    // ==========================================
    // 마우스 클릭 시작
    // ==========================================

    editor.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();


            const pixel =
                getPixel(
                    event
                );


            if (
                tool ===
                "picker"
            ) {

                pickColor(
                    pixel.x,
                    pixel.y
                );


                return;
            }


            saveHistory();


            drawing =
                true;


            lastX =
                pixel.x;


            lastY =
                pixel.y;


            paint(
                pixel.x,
                pixel.y
            );


            editor.setPointerCapture(
                event.pointerId
            );
        }
    );


    // ==========================================
    // 마우스 드래그
    // ==========================================

    editor.addEventListener(
        "pointermove",
        event => {

            const pixel =
                getPixel(
                    event
                );


            coordinate.textContent =
                `X: ${pixel.x} / Y: ${pixel.y}`;


            if (
                !drawing
            ) {

                return;
            }


            if (
                lastX === pixel.x
                &&
                lastY === pixel.y
            ) {

                return;
            }


            paint(
                pixel.x,
                pixel.y
            );


            lastX =
                pixel.x;


            lastY =
                pixel.y;
        }
    );


    // ==========================================
    // 마우스 클릭 종료
    // ==========================================

    window.addEventListener(
        "pointerup",
        () => {

            drawing =
                false;


            lastX =
                -1;


            lastY =
                -1;
        }
    );


    // ==========================================
    // 전체 지우기
    // ==========================================

    function clearCanvas() {

        if (
            !confirm(
                "그림을 전부 지울까요?"
            )
        ) {

            return;
        }


        saveHistory();


        capeCtx.clearRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        render();
    }


    // ==========================================
    // 기본 양식 불러오기
    // ==========================================

    function loadDefaultCape(
        saveUndo = false
    ) {

        const image =
            new Image();


        image.onload =
            function() {


                if (
                    saveUndo
                ) {

                    saveHistory();
                }


                capeCtx.clearRect(
                    0,
                    0,
                    WIDTH,
                    HEIGHT
                );


                capeCtx.imageSmoothingEnabled =
                    false;


                capeCtx.drawImage(
                    image,
                    0,
                    0,
                    WIDTH,
                    HEIGHT
                );


                render();
            };


        image.src =
            DEFAULT_CAPE;
    }


    // ==========================================
    // 기본 양식 복원
    // ==========================================

    function resetToDefault() {

        if (
            !confirm(
                "기본 망토 양식으로 되돌릴까요?"
            )
        ) {

            return;
        }


        loadDefaultCape(
            true
        );
    }


    // ==========================================
    // 사용자가 PNG 불러오기
    // ==========================================

    document
        .getElementById(
            "fileInput"
        )
        .addEventListener(
            "change",
            event => {

                const file =
                    event.target.files[0];


                if (
                    !file
                ) {

                    return;
                }


                const image =
                    new Image();


                image.onload =
                    function() {


                        if (
                            image.width !==
                            64
                            ||
                            image.height !==
                            32
                        ) {

                            alert(
                                "64×32 PNG 파일만 불러올 수 있습니다."
                            );


                            URL.revokeObjectURL(
                                image.src
                            );


                            return;
                        }


                        saveHistory();


                        capeCtx.clearRect(
                            0,
                            0,
                            WIDTH,
                            HEIGHT
                        );


                        capeCtx.imageSmoothingEnabled =
                            false;


                        capeCtx.drawImage(
                            image,
                            0,
                            0,
                            WIDTH,
                            HEIGHT
                        );


                        render();


                        URL.revokeObjectURL(
                            image.src
                        );
                    };


                image.src =
                    URL.createObjectURL(
                        file
                    );
            }
        );


    // ==========================================
    // 정확히 64x32 PNG 다운로드
    // ==========================================

    function downloadCape() {

        capeCanvas.toBlob(

            blob => {

                if (
                    !blob
                ) {

                    alert(
                        "PNG 생성에 실패했습니다."
                    );


                    return;
                }


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    url;


                link.download =
                    "customcape.png";


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();


                URL.revokeObjectURL(
                    url
                );

            },

            "image/png"
        );
    }


    // ==========================================
    // 시작
    // ==========================================

    updateFromRGB();


    loadDefaultCape(
        false
    );

</script>

</body>
</html>
